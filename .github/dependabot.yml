version: 2

# Security updates only.
#
# `open-pull-requests-limit: 0` switches off version-update PRs (the weekly "bump
# everything" noise) but leaves Dependabot security updates running, as GitHub
# documents. Dependabot never merges anything by itself, and no workflow in this
# repo does either, so every PR needs a human review and merge.
#
# dependabot.yml has no severity filter. To report only high and critical advisories,
# add an auto-triage rule under Settings > Advanced Security > Dependabot rules
# that dismisses alerts with low and medium severity.

updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Europe/Stockholm'
    target-branch: 'dev'
    open-pull-requests-limit: 0
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'security'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    target-branch: 'dev'
    open-pull-requests-limit: 0
    commit-message:
      prefix: 'chore(ci)'
    labels:
      - 'dependencies'
      - 'github-actions'
      - 'security'
