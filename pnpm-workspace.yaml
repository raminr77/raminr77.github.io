allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  sharp: true
  unrs-resolver: true
overrides:
  # Transitive-only. Pinned to an exact patch version within the major line each
  # dependent actually requests, so an open range can't dedupe across a major
  # the dependent never asked for (e.g. gray-matter calls js-yaml's v3-only
  # `safeLoad`/`safeDump`, removed in v4 — a v4 override would break post parsing).
  # See `pnpm audit`.
  brace-expansion@^5.0.5: '5.0.9'
  fast-uri@^3.0.1: '3.1.6'
  js-yaml@^3.13.1: '3.15.2'
minimumReleaseAgeExclude:
  - '@sentry/browser-utils@10.67.0'
  - '@sentry/browser@10.67.0'
  - '@sentry/core@10.67.0'
  - '@sentry/feedback@10.67.0'
  - '@sentry/nextjs@10.67.0'
  - '@sentry/node-core@10.67.0'
  - '@sentry/node@10.67.0'
  - '@sentry/opentelemetry@10.67.0'
  - '@sentry/react@10.67.0'
  - '@sentry/replay-canvas@10.67.0'
  - '@sentry/replay@10.67.0'
  - '@sentry/server-utils@10.67.0'
  - '@sentry/vercel-edge@10.67.0'
  - markdown-to-jsx@9.9.0
  - '@testing-library/jest-dom@7.0.0'
  - '@typescript-eslint/eslint-plugin@8.65.0'
  - '@typescript-eslint/parser@8.65.0'
  - '@typescript-eslint/project-service@8.65.0'
  - '@typescript-eslint/scope-manager@8.65.0'
  - '@typescript-eslint/tsconfig-utils@8.65.0'
  - '@typescript-eslint/type-utils@8.65.0'
  - '@typescript-eslint/types@8.65.0'
  - '@typescript-eslint/typescript-estree@8.65.0'
  - '@typescript-eslint/utils@8.65.0'
  - '@typescript-eslint/visitor-keys@8.65.0'
  - lighthouse@13.4.1
  - postcss@8.5.21
  - prettier@3.9.6
  - sass@1.103.0
  - typescript-eslint@8.65.0
  - enhanced-resolve@5.24.4
  - framer-motion@12.43.0
  - motion-dom@12.43.0
  - motion@12.43.0
  - webpack@5.109.2 || 5.110.2
  - qs@6.16.0
  - react-hook-form@7.87.0
