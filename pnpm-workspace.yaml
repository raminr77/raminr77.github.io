allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  sharp: true
  unrs-resolver: true
overrides:
  # Transitive-only. Pinned to an exact patch version within the major line each
  # dependent actually requests, so an open range can't dedupe across a major
  # the dependent never asked for (e.g. gray-matter calls js-yaml's v3-only
  # `safeLoad`/`safeDump`, removed in v4 — a v4 override would break post parsing).
  # See `pnpm audit`.
  brace-expansion@^5.0.5: '5.0.9'
  fast-uri@^3.0.1: '3.1.6'
  js-yaml@^3.13.1: '3.15.2'
minimumReleaseAgeExclude:
  - '@sentry/browser-utils@10.67.0 || 11.7.0'
  - '@sentry/browser@10.67.0 || 11.7.0'
  - '@sentry/core@10.67.0 || 11.7.0'
  - '@sentry/feedback@10.67.0 || 11.7.0'
  - '@sentry/nextjs@10.67.0 || 11.7.0'
  - '@sentry/node-core@10.67.0'
  - '@sentry/node@10.67.0 || 11.7.0'
  - '@sentry/opentelemetry@10.67.0 || 11.7.0'
  - '@sentry/react@10.67.0 || 11.7.0'
  - '@sentry/replay-canvas@10.67.0 || 11.7.0'
  - '@sentry/replay@10.67.0 || 11.7.0'
  - '@sentry/server-utils@10.67.0 || 11.7.0'
  - '@sentry/vercel-edge@10.67.0 || 11.7.0'
  - markdown-to-jsx@9.9.0
